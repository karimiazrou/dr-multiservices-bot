services:
  - type: worker
    name: dr-multiservices-bot
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: python dr_multiservices_bot.py
    envVars:
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_BASE_URL
        sync: false
